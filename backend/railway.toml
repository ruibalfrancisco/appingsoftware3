# Configuración como código del servicio "api" en Railway.
# Se aplica en cada `railway up backend --path-as-root --service api` y reemplaza lo que
# esté cargado a mano en Settings: así queda versionada y revisada por PR.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Migraciones antes de publicar la versión nueva; si fallan, sigue corriendo la anterior.
preDeployCommand = ["alembic upgrade head"]
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
