# Integración continua: corre en cada pull request y, desde deploy.yml, en cada push a main.
# Los nombres de los jobs son los "status checks" que exige la regla de la rama main.
name: ci

on:
  pull_request:
  workflow_call:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # En un PR, un push nuevo cancela la corrida vieja; en main no se cancela nada.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: '0.13.9'
  NODE_VERSION: '26'

jobs:
  lint-y-tipos:
    name: lint-y-tipos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Backend · dependencias
        working-directory: backend
        run: uv sync --locked
      - name: Backend · ruff (lint)
        working-directory: backend
        run: uv run ruff check --output-format=github .
      - name: Backend · ruff (formato)
        working-directory: backend
        run: uv run ruff format --check .
      - name: Backend · mypy (tipos)
        working-directory: backend
        run: uv run mypy

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - name: Frontend · dependencias
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Frontend · ESLint
        working-directory: frontend
        run: npm run lint
      - name: Frontend · Prettier
        working-directory: frontend
        run: npm run format:check
      - name: Frontend · tsc (tipos)
        working-directory: frontend
        run: npm run typecheck
      - name: E2E · tsc (tipos)
        working-directory: e2e
        run: npm ci --no-audit --no-fund && npm run typecheck

  unitarias:
    name: unitarias
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Backend · pruebas unitarias con cobertura
        working-directory: backend
        run: |
          uv sync --locked
          uv run python -m pytest -m "not integracion" --cov=app --cov-report=term-missing --cov-report=xml
      - name: Backend · umbral de 80 % en el dominio (RNF-10)
        working-directory: backend
        run: |
          {
            echo '### Cobertura del dominio (backend)'
            echo '```'
            uv run python -m coverage report --include='app/dominio/*'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          uv run python -m coverage report --include='app/dominio/*' --fail-under=80

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend · pruebas unitarias con cobertura (umbral 70 %)
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run test:cov

      - name: Guardar reportes de cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cobertura
          path: |
            backend/coverage.xml
            frontend/coverage/lcov.info
          if-no-files-found: ignore

  integracion:
    name: integracion
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      db:
        # Misma imagen que infra/docker-compose.yml.
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: reclamos
          POSTGRES_PASSWORD: reclamos
          POSTGRES_DB: reclamos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reclamos -d reclamos"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      fotos:
        # Servidor S3 local, como en infra/docker-compose.yml. La prueba crea el bucket.
        image: rustfs/rustfs:1.0.6
        env:
          RUSTFS_ACCESS_KEY: reclamos
          RUSTFS_SECRET_KEY: reclamos-local
        ports:
          - 9000:9000
    env:
      DATABASE_URL: postgresql://reclamos:reclamos@localhost:5432/reclamos
      AWS_ENDPOINT_URL: http://127.0.0.1:9000
      AWS_ACCESS_KEY_ID: reclamos
      AWS_SECRET_ACCESS_KEY: reclamos-local
      AWS_S3_BUCKET_NAME: fotos
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Pruebas de integración contra PostGIS real
        working-directory: backend
        run: |
          uv sync --locked
          uv run python -m pytest -m integracion -v

  # Recorridos completos en un navegador real contra la app levantada acá mismo:
  # API (uvicorn) + web (build de producción con el proxy /api) + PostGIS + Mailpit.
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      db:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: reclamos
          POSTGRES_PASSWORD: reclamos
          POSTGRES_DB: reclamos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reclamos -d reclamos"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      mailpit:
        image: axllent/mailpit:v1.34
        ports:
          - 1025:1025
          - 8025:8025
      fotos:
        image: rustfs/rustfs:1.0.6
        env:
          RUSTFS_ACCESS_KEY: reclamos
          RUSTFS_SECRET_KEY: reclamos-local
        ports:
          - 9000:9000
    env:
      DATABASE_URL: postgresql://reclamos:reclamos@localhost:5432/reclamos
      EMAIL_BACKEND: smtp
      SMTP_HOST: localhost
      SMTP_PORT: '1025'
      FRONTEND_URL: http://localhost:4173
      WEB_URL: http://localhost:4173
      API_URL: http://localhost:8000
      MAILPIT_URL: http://localhost:8025
      AWS_ENDPOINT_URL: http://127.0.0.1:9000
      AWS_ACCESS_KEY_ID: reclamos
      AWS_SECRET_ACCESS_KEY: reclamos-local
      AWS_S3_BUCKET_NAME: fotos
      # Mapa simulado y sin búsqueda de direcciones: los E2E no dependen de servicios externos.
      VITE_MAPA: simulado
      GEOCODIFICAR: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Levantar la API
        working-directory: backend
        run: |
          uv sync --locked
          uv run alembic upgrade head
          # Bucket de fotos en RustFS (reintenta mientras el servicio termina de arrancar).
          for i in $(seq 1 20); do
            uv run python -c "from app.almacenamiento import AlmacenS3; from app.config import Settings; s = Settings(); AlmacenS3(s).cliente.create_bucket(Bucket=s.aws_s3_bucket_name)" && break
            sleep 1
          done
          nohup uv run uvicorn app.main:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/api.log" 2>&1 &
      - name: Levantar la web (build de producción con proxy /api)
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
          nohup npx vite preview --port 4173 --strictPort > "$RUNNER_TEMP/web.log" 2>&1 &
      - name: Esperar a que la web y la API respondan
        run: |
          for i in $(seq 1 30); do
            curl -fsS http://localhost:4173/api/health && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/api.log" "$RUNNER_TEMP/web.log"
          exit 1

      - name: E2E con Playwright (Chromium, celular)
        working-directory: e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          npx playwright test --project=e2e

      - name: Guardar reporte y logs si falla
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-reporte
          path: |
            e2e/playwright-report
            e2e/test-results
            ${{ runner.temp }}/api.log
            ${{ runner.temp }}/web.log

  imagenes:
    name: imagenes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Construir la imagen de la api
        run: docker build -t reclamos-api:ci backend
      - name: Construir la imagen de la web
        run: docker build -t reclamos-web:ci frontend
      # Misma topología que en Railway: la web reenvía /api a la api por una red privada.
      - name: Probar los contenedores y el proxy /api
        run: |
          docker network create privada
          docker run -d --name api --network privada -e PORT=8000 reclamos-api:ci
          docker run -d --name web --network privada -e PORT=8080 \
            -e API_INTERNAL_URL=http://api:8000 -p 8080:8080 reclamos-web:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/api/health; then
              echo
              curl -fsS -D - -o /dev/null http://localhost:8080/ | tee headers.txt
              grep -qi '^x-content-type-options: nosniff' headers.txt
              grep -qi '^x-frame-options: deny' headers.txt
              exit 0
            fi
            sleep 1
          done
          docker logs api; docker logs web
          exit 1

  seguridad:
    name: seguridad
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks revisa todo el historial, no solo el último commit
      - name: Secretos (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

      - uses: astral-sh/setup-uv@v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: Vulnerabilidades en dependencias de Python (pip-audit)
        working-directory: backend
        run: |
          uv export --frozen --no-dev --no-hashes --format requirements-txt --output-file "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit==2.10.1 --requirement "$RUNNER_TEMP/requirements.txt" --no-deps --disable-pip --strict

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Vulnerabilidades en dependencias de producción del frontend (npm audit)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
