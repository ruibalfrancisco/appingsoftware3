# Integración continua: corre en cada pull request y, desde deploy.yml, en cada push a main.
# Los nombres de los jobs son los "status checks" que exige la regla de la rama main.
name: ci

on:
  pull_request:
  workflow_call:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # En un PR, un push nuevo cancela la corrida vieja; en main no se cancela nada.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: '0.13.9'
  NODE_VERSION: '26'

jobs:
  lint-y-tipos:
    name: lint-y-tipos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Backend · dependencias
        working-directory: backend
        run: uv sync --locked
      - name: Backend · ruff (lint)
        working-directory: backend
        run: uv run ruff check --output-format=github .
      - name: Backend · ruff (formato)
        working-directory: backend
        run: uv run ruff format --check .
      - name: Backend · mypy (tipos)
        working-directory: backend
        run: uv run mypy

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - name: Frontend · dependencias
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Frontend · ESLint
        working-directory: frontend
        run: npm run lint
      - name: Frontend · Prettier
        working-directory: frontend
        run: npm run format:check
      - name: Frontend · tsc (tipos)
        working-directory: frontend
        run: npm run typecheck
      - name: E2E · tsc (tipos)
        working-directory: e2e
        run: npm ci --no-audit --no-fund && npm run typecheck

  unitarias:
    name: unitarias
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write # para publicar el informe de pruebas
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Backend · pruebas unitarias con cobertura
        working-directory: backend
        run: |
          uv sync --locked
          uv run python -m pytest -m "not integracion" --junitxml=reportes/unitarias.xml \
            -o junit_suite_name=backend --cov=app --cov-report=term-missing --cov-report=xml
      - name: Backend · umbral de 80 % en el dominio (RNF-10)
        working-directory: backend
        run: |
          {
            echo '### Cobertura del dominio del backend (reglas de negocio, umbral 80 %)'
            echo '```'
            uv run python -m coverage report --include='app/dominio/*'
            echo '```'
            echo "En todo el backend, las unitarias cubren $(uv run python -m coverage report --format=total) %;"
            echo 'las rutas y el acceso a la base los cubren las pruebas de integración (job integracion).'
          } >> "$GITHUB_STEP_SUMMARY"
          uv run python -m coverage report --include='app/dominio/*' --fail-under=80

      # Aunque fallen las del backend, las del frontend corren igual: el informe muestra todo.
      - uses: actions/setup-node@v7
        if: ${{ !cancelled() }}
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend · pruebas unitarias con cobertura (umbral 70 %)
        if: ${{ !cancelled() }}
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run test:cov
      - name: Frontend · cobertura en el resumen
        if: ${{ !cancelled() && hashFiles('frontend/coverage/coverage-summary.json') != '' }}
        working-directory: frontend
        run: |
          node -e '
            const t = JSON.parse(require("fs").readFileSync("coverage/coverage-summary.json")).total
            const p = (k) => `${t[k].pct} %`
            console.log("### Cobertura del frontend (umbral 70 %)\n")
            console.log("| Líneas | Sentencias | Funciones | Ramas |\n|---|---|---|---|")
            console.log(`| ${p("lines")} | ${p("statements")} | ${p("functions")} | ${p("branches")} |`)
          ' >> "$GITHUB_STEP_SUMMARY"

      # El informe aparece como un check más ("Informe · pruebas unitarias") con cada prueba,
      # y como tabla en el resumen de la corrida. Equivale a PublishTestResults de Azure DevOps.
      - name: Publicar el informe de pruebas unitarias
        if: ${{ !cancelled() }}
        uses: EnricoMi/publish-unit-test-result-action/linux@v2.26.0
        with:
          check_name: Informe · pruebas unitarias
          files: |
            backend/reportes/*.xml
            frontend/reportes/*.xml
          comment_mode: off

      - name: Guardar informes y cobertura (HTML)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: informe-unitarias
          path: |
            backend/reportes
            backend/coverage.xml
            frontend/reportes
            frontend/coverage
          if-no-files-found: ignore
          retention-days: 30

  # Si fallan las unitarias (o el lint), no se construye nada ni se corre lo que sigue: los
  # jobs de abajo quedan "skipped" y el PR no se puede mergear (consigna del TP integrador).
  integracion:
    name: integracion
    needs: [lint-y-tipos, unitarias]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write # para publicar el informe de pruebas
    services:
      db:
        # Misma imagen que infra/docker-compose.yml.
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: reclamos
          POSTGRES_PASSWORD: reclamos
          POSTGRES_DB: reclamos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reclamos -d reclamos"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      fotos:
        # Servidor S3 local, como en infra/docker-compose.yml. La prueba crea el bucket.
        image: rustfs/rustfs:1.0.6
        env:
          RUSTFS_ACCESS_KEY: reclamos
          RUSTFS_SECRET_KEY: reclamos-local
        ports:
          - 9000:9000
    env:
      DATABASE_URL: postgresql://reclamos:reclamos@localhost:5432/reclamos
      AWS_ENDPOINT_URL: http://127.0.0.1:9000
      AWS_ACCESS_KEY_ID: reclamos
      AWS_SECRET_ACCESS_KEY: reclamos-local
      AWS_S3_BUCKET_NAME: fotos
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Pruebas de integración contra PostGIS real
        working-directory: backend
        run: |
          uv sync --locked
          uv run python -m pytest -m integracion -v --junitxml=reportes/integracion.xml \
            -o junit_suite_name=backend-integracion --cov=app --cov-report=term
          echo "### Cobertura del backend con las pruebas de integración: $(uv run python -m coverage report --format=total) %" >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar el informe de pruebas de integración
        if: ${{ !cancelled() }}
        uses: EnricoMi/publish-unit-test-result-action/linux@v2.26.0
        with:
          check_name: Informe · pruebas de integración (API + PostGIS + S3)
          files: backend/reportes/*.xml
          comment_mode: off

  # Recorridos completos en un navegador real contra la app levantada acá mismo:
  # API (uvicorn) + web (build de producción con el proxy /api) + PostGIS + Mailpit.
  e2e:
    name: e2e
    needs: [lint-y-tipos, unitarias]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write # para publicar el informe de pruebas
    timeout-minutes: 15
    services:
      db:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: reclamos
          POSTGRES_PASSWORD: reclamos
          POSTGRES_DB: reclamos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reclamos -d reclamos"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      mailpit:
        image: axllent/mailpit:v1.34
        ports:
          - 1025:1025
          - 8025:8025
      fotos:
        image: rustfs/rustfs:1.0.6
        env:
          RUSTFS_ACCESS_KEY: reclamos
          RUSTFS_SECRET_KEY: reclamos-local
        ports:
          - 9000:9000
    env:
      DATABASE_URL: postgresql://reclamos:reclamos@localhost:5432/reclamos
      EMAIL_BACKEND: smtp
      SMTP_HOST: localhost
      SMTP_PORT: '1025'
      FRONTEND_URL: http://localhost:4173
      WEB_URL: http://localhost:4173
      API_URL: http://localhost:8000
      MAILPIT_URL: http://localhost:8025
      AWS_ENDPOINT_URL: http://127.0.0.1:9000
      AWS_ACCESS_KEY_ID: reclamos
      AWS_SECRET_ACCESS_KEY: reclamos-local
      AWS_S3_BUCKET_NAME: fotos
      # Mapa simulado y sin búsqueda de direcciones: los E2E no dependen de servicios externos.
      VITE_MAPA: simulado
      GEOCODIFICAR: 'false'
      # Operadora del back office para E2E-04 (solo existe en esta base efímera del CI).
      OPERADOR_DNI: '20999888'
      OPERADOR_CLAVE: clave-de-operadora-1
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Levantar la API
        working-directory: backend
        run: |
          uv sync --locked
          uv run alembic upgrade head
          # Personal municipal para el back office (CU-10 se carga con este script).
          CLAVE_INICIAL="$OPERADOR_CLAVE" uv run python -m app.municipales --dni "$OPERADOR_DNI" \
            --nombre Olga --apellido Operadora --email operadora@villaallende.gob.ar --rol operador
          # Bucket de fotos en RustFS (reintenta mientras el servicio termina de arrancar).
          for i in $(seq 1 20); do
            uv run python -c "from app.almacenamiento import AlmacenS3; from app.config import Settings; s = Settings(); AlmacenS3(s).cliente.create_bucket(Bucket=s.aws_s3_bucket_name)" && break
            sleep 1
          done
          nohup uv run uvicorn app.main:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/api.log" 2>&1 &
      - name: Levantar la web (build de producción con proxy /api)
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
          nohup npx vite preview --port 4173 --strictPort > "$RUNNER_TEMP/web.log" 2>&1 &
      - name: Esperar a que la web y la API respondan
        run: |
          for i in $(seq 1 30); do
            curl -fsS http://localhost:4173/api/health && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/api.log" "$RUNNER_TEMP/web.log"
          exit 1

      - name: E2E con Playwright (Chromium, celular)
        working-directory: e2e
        env:
          INFORME: e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          npx playwright test --project=e2e

      - name: Publicar el informe de pruebas E2E
        if: ${{ !cancelled() }}
        uses: EnricoMi/publish-unit-test-result-action/linux@v2.26.0
        with:
          check_name: Informe · pruebas E2E (navegador)
          files: e2e/reportes/*.xml
          comment_mode: off

      # El informe HTML de Playwright (con trazas si hubo reintentos) queda siempre; los logs
      # de la API y la web, solo si algo falló.
      - name: Guardar el informe HTML
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: informe-e2e
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore
          retention-days: 30
      - name: Guardar logs si falla
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-logs
          path: |
            ${{ runner.temp }}/api.log
            ${{ runner.temp }}/web.log

  imagenes:
    name: imagenes
    needs: [lint-y-tipos, unitarias]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Construir la imagen de la api
        run: docker build -t reclamos-api:ci backend
      - name: Construir la imagen de la web
        run: docker build -t reclamos-web:ci frontend
      # Misma topología que en Railway: la web reenvía /api a la api por una red privada.
      - name: Probar los contenedores y el proxy /api
        run: |
          docker network create privada
          docker run -d --name api --network privada -e PORT=8000 reclamos-api:ci
          docker run -d --name web --network privada -e PORT=8080 \
            -e API_INTERNAL_URL=http://api:8000 -p 8080:8080 reclamos-web:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/api/health; then
              echo
              curl -fsS -D - -o /dev/null http://localhost:8080/ | tee headers.txt
              grep -qi '^x-content-type-options: nosniff' headers.txt
              grep -qi '^x-frame-options: deny' headers.txt
              # El worker del mapa (.mjs) tiene que salir como JavaScript: con nosniff, si no,
              # el navegador no lo ejecuta y el mapa queda sin calles.
              worker=$(docker exec web sh -c 'ls /usr/share/nginx/html/assets/*.mjs' | head -1 | xargs basename)
              curl -fsS -D - -o /dev/null "http://localhost:8080/assets/$worker" | tee worker.txt
              grep -qi '^content-type: application/javascript' worker.txt
              exit 0
            fi
            sleep 1
          done
          docker logs api; docker logs web
          exit 1

  seguridad:
    name: seguridad
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks revisa todo el historial, no solo el último commit
      - name: Secretos (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

      - uses: astral-sh/setup-uv@v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: Vulnerabilidades en dependencias de Python (pip-audit)
        working-directory: backend
        run: |
          uv export --frozen --no-dev --no-hashes --format requirements-txt --output-file "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit==2.10.1 --requirement "$RUNNER_TEMP/requirements.txt" --no-deps --disable-pip --strict

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Vulnerabilidades en dependencias de producción del frontend (npm audit)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
