# Entrega continua: cada push a main (un PR aprobado y mergeado) pasa por CI, se despliega a QA
# (el ambiente "staging") con smoke test y pruebas de integración, y queda esperando la
# aprobación manual para producción (ambiente "production" de GitHub).
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Nunca dos despliegues al mismo ambiente a la vez: cada ambiente tiene su propia fila (ver la
# concurrency de cada job). Así, una aprobación de producción pendiente no traba staging.

permissions:
  contents: read

jobs:
  ci:
    # Las mismas pruebas que en el PR, sobre el commit exacto que se va a desplegar.
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      pull-requests: read
      checks: write # los informes de pruebas

  staging:
    name: QA (staging)
    needs: ci
    # Hasta que Railway esté configurado (sección 6 de la guía), el despliegue se saltea.
    if: vars.RAILWAY_PROJECT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    environment:
      name: staging
      url: ${{ vars.WEB_URL }}
    permissions:
      contents: read
      checks: write # el informe de pruebas de QA
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/desplegar
        with:
          ambiente: staging
          proyecto: ${{ vars.RAILWAY_PROJECT_ID }}
          web-url: ${{ vars.WEB_URL }}
          api-url: ${{ vars.API_URL }}

      # Con la versión nueva ya publicada en QA: recorridos contra la web, la API, la base y el
      # bucket de ese ambiente, con una cuenta de prueba que solo existe en QA.
      - name: Pruebas de integración en QA
        working-directory: e2e
        env:
          WEB_URL: ${{ vars.WEB_URL }}
          EXPECTED_COMMIT: ${{ github.sha }}
          QA_USUARIO_DNI: ${{ vars.QA_USUARIO_DNI }}
          QA_USUARIO_CLAVE: ${{ secrets.QA_USUARIO_CLAVE }}
          INFORME: integracion-qa
        run: npx playwright test --project=qa

      - name: Publicar el informe de QA
        if: ${{ !cancelled() }}
        uses: EnricoMi/publish-unit-test-result-action/linux@v2.26.0
        with:
          check_name: Informe · QA (smoke + integración)
          files: e2e/reportes/*.xml
          comment_mode: off
      - name: Guardar el informe HTML
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: informe-qa
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore
          retention-days: 30

  production:
    name: Producción
    needs: staging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Si hay una aprobación pendiente de una versión anterior, esta espera detrás. Conviene
    # rechazar la vieja y aprobar la más nueva, que ya incluye todo.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    # Acá GitHub frena hasta que un revisor apruebe (Required reviewers del ambiente).
    environment:
      name: production
      url: ${{ vars.WEB_URL }}
    permissions:
      contents: write # para crear el tag de versión
      checks: write # el informe del smoke test
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/desplegar
        with:
          ambiente: production
          proyecto: ${{ vars.RAILWAY_PROJECT_ID }}
          web-url: ${{ vars.WEB_URL }}
          api-url: ${{ vars.API_URL }}
      - name: Publicar el informe del smoke test
        if: ${{ !cancelled() }}
        uses: EnricoMi/publish-unit-test-result-action/linux@v2.26.0
        with:
          check_name: Informe · producción (smoke)
          files: e2e/reportes/*.xml
          comment_mode: off

      - name: Etiquetar la versión (SemVer desde el archivo VERSION)
        run: |
          tag="v$(tr -d '[:space:]' < VERSION)"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null; then
            echo "::notice::El tag ${tag} ya existe. Subí VERSION en un PR para publicar una versión nueva."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              tag -a "${tag}" -m "Release ${tag} (${GITHUB_SHA::7})" "${GITHUB_SHA}"
          git push origin "${tag}"
          echo "### Publicado ${tag} en producción" >> "$GITHUB_STEP_SUMMARY"
