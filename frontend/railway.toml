# Configuración como código del servicio "web" en Railway.
# Se aplica en cada `railway up frontend --path-as-root --service web`.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
